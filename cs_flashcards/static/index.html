<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS 개념 플래시카드</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>CS 개념 플래시카드</h1>
      <p id="csvPath" class="muted">CSV 로딩 중...</p>
    </div>
    <div class="stats" aria-live="polite">
      <span>전체 <strong id="statTotal">0</strong></span>
      <span>O <strong id="statKnown">0</strong></span>
      <span>X <strong id="statUnknown">0</strong></span>
      <span>미학습 <strong id="statUnreviewed">0</strong></span>
    </div>
  </header>

  <main class="layout">
    <aside id="controlsPanel" class="panel controls">
      <button id="controlsToggle" class="controls-toggle" type="button" aria-expanded="true" aria-controls="controlsBody">검색/필터 접기</button>
      <div id="controlsBody" class="controls-body">
      <label>검색
        <input id="searchInput" type="search" placeholder="개념, 설명, 관련 개념 검색" />
      </label>
      <label>카테고리
        <select id="categorySelect"><option value="">전체</option></select>
      </label>
      <label>학습 상태
        <select id="statusSelect">
          <option value="">전체</option>
          <option value="unreviewed">미학습</option>
          <option value="O">안다 O</option>
          <option value="X">모른다 X</option>
        </select>
      </label>
      <div class="audio-panel" aria-label="자동 음성 재생 설정">
        <div class="audio-title">자동 듣기</div>
        <div class="audio-options">
          <label><input id="speakTerm" type="checkbox" checked /> 카드명</label>
          <label><input id="speakDefinition" type="checkbox" checked /> 간단설명</label>
          <label><input id="speakDetail" type="checkbox" /> 상세설명</label>
          <label><input id="speakRelated" type="checkbox" /> 관련개념</label>
          <label><input id="speakExam" type="checkbox" /> 시험포인트</label>
        </div>
        <label class="audio-rate-label">재생 속도
          <select id="speechRate">
            <option value="1">1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <div class="audio-buttons">
          <button id="playAudioBtn" type="button">▶ 재생</button>
          <button id="stopAudioBtn" type="button">■ 정지</button>
        </div>
      </div>

      <div class="button-grid">
        <button id="prevBtn" type="button">← 이전</button>
        <button id="nextBtn" type="button">다음 →</button>
        <button id="shuffleBtn" type="button">랜덤</button>
        <button id="unknownOnlyBtn" type="button">X만 복습</button>
      </div>
      <p class="hint">단축키: Space 뒤집기 · ←/→ 이동 · O 안다 · X 모른다 · R 랜덤 · F 검색</p>
      <p id="message" class="message" role="status"></p>
      </div>
    </aside>

    <section class="study-area">
      <div class="progress-line">
        <span id="positionText">0 / 0</span>
        <span id="filterText" class="muted">필터 없음</span>
      </div>

      <article id="card" class="flashcard" tabindex="0" aria-label="플래시카드. 클릭하면 뒤집힙니다.">
        <div class="card-inner">
          <div class="card-face front">
            <div class="badges">
              <span id="frontCategory" class="badge"></span>
              <span id="frontStatus" class="badge status"></span>
            </div>
            <div class="term-line front-term-line">
              <h2 id="frontTerm">로딩 중...</h2>
              <span class="external-links" aria-label="나무위키 검색 링크">
                <a id="frontNamuKoLink" class="external-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="나무위키에서 한글 개념 검색" title="나무위키 한글 검색">한</a>
                <a id="frontNamuEnLink" class="external-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="나무위키에서 영어 개념 검색" title="나무위키 영어 검색">En</a>
              </span>
            </div>
            <p id="frontEnglish" class="english"></p>
          </div>
          <div class="card-face back">
            <div class="back-scroll">
              <div class="badges">
                <span id="backCategory" class="badge"></span>
                <span id="backId" class="badge"></span>
              </div>
              <div class="term-line back-term-line">
                <h2 id="backTerm"></h2>
                <span class="external-links" aria-label="나무위키 검색 링크">
                  <a id="backNamuKoLink" class="external-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="나무위키에서 한글 개념 검색" title="나무위키 한글 검색">한</a>
                  <a id="backNamuEnLink" class="external-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="나무위키에서 영어 개념 검색" title="나무위키 영어 검색">En</a>
                </span>
              </div>
              <section>
                <h3>간단 설명</h3>
                <p id="definition"></p>
              </section>
              <section>
                <h3>상세 설명</h3>
                <div id="detail" class="detail-grid"></div>
              </section>
              <section>
                <h3>관련 개념</h3>
                <div id="related" class="chips"></div>
              </section>
              <section>
                <h3>관련 개념 그래프</h3>
                <div id="conceptGraph" class="concept-graph" aria-label="현재 카드와 관련 개념의 연결 그래프"></div>
              </section>
              <details class="source-details">
                <summary>출처 파일</summary>
                <p id="sources" class="small"></p>
              </details>
              <section>
                <h3>시험 포인트</h3>
                <p id="examNote"></p>
              </section>
            </div>
          </div>
        </div>
      </article>

      <div class="mark-row">
        <button id="knownBtn" class="mark known" type="button">안다 O</button>
        <button id="unknownBtn" class="mark unknown" type="button">모른다 X</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
