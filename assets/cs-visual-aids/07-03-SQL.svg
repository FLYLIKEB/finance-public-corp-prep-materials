<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">SQL 처리 순서</title>
<desc id="desc">문법 작성 순서와 논리 처리 순서를 구분한다.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<rect x="24" y="24" width="872" height="312" rx="28" fill="white" stroke="#dbe3ef" stroke-width="2"/>
<text x="460" y="72" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">SQL 처리 순서</text>
<text x="460" y="104" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="16" fill="#475569">문법 작성 순서와 논리 처리 순서를 구분한다.</text>
<rect x="60" y="132" width="140" height="92" rx="18" fill="#2563eb" opacity="0.10" stroke="#2563eb" stroke-width="2"/>
<circle cx="92" cy="160" r="15" fill="#2563eb"/>
<text x="92" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">1</text>
<text x="130.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">FROM/JOIN</text>
<path d="M 206 178 L 218 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="224" y="132" width="140" height="92" rx="18" fill="#16a34a" opacity="0.10" stroke="#16a34a" stroke-width="2"/>
<circle cx="256" cy="160" r="15" fill="#16a34a"/>
<text x="256" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">2</text>
<text x="294.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">WHERE</text>
<path d="M 370 178 L 382 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="388" y="132" width="140" height="92" rx="18" fill="#f97316" opacity="0.10" stroke="#f97316" stroke-width="2"/>
<circle cx="420" cy="160" r="15" fill="#f97316"/>
<text x="420" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">3</text>
<text x="458.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">GROUP BY</text>
<path d="M 534 178 L 546 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="552" y="132" width="140" height="92" rx="18" fill="#7c3aed" opacity="0.10" stroke="#7c3aed" stroke-width="2"/>
<circle cx="584" cy="160" r="15" fill="#7c3aed"/>
<text x="584" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">4</text>
<text x="622.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HAVING</text>
<path d="M 698 178 L 710 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="716" y="132" width="140" height="92" rx="18" fill="#dc2626" opacity="0.10" stroke="#dc2626" stroke-width="2"/>
<circle cx="748" cy="160" r="15" fill="#dc2626"/>
<text x="748" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">5</text>
<text x="786.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SELECT/ORDER</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>
<text x="460" y="286" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#64748b">금융공기업 IT 필기 대비 개념 시각화</text>
