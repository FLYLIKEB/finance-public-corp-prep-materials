<text x="460" y="72" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">IDS·IPS·로그 감사</text>
<text x="460" y="104" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="16" fill="#475569">탐지는 IDS, 차단은 IPS로 구분한다.</text>
