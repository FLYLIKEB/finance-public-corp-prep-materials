<text x="298" y="166" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">2</text>
<text x="357.0" y="191" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">탐지</text>
<path d="M 454 178 L 466 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="472" y="132" width="182" height="92" rx="18" fill="#f97316" opacity="0.10" stroke="#f97316" stroke-width="2"/>
