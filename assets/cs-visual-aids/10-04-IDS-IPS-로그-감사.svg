<path d="M 248 178 L 260 178" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="266" y="132" width="182" height="92" rx="18" fill="#16a34a" opacity="0.10" stroke="#16a34a" stroke-width="2"/>
