<text x="460" y="286" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Arial, sans-serif" font-size="15" fill="#64748b">금융공기업 IT 필기 대비 개념 시각화</text>
