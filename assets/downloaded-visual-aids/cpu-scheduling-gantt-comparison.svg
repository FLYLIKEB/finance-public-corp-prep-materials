<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">FCFS SJF HRN RR 간트 차트 비교</title>
  <desc id="desc">동일한 프로세스 집합에 대해 FCFS, SJF, HRN, RR이 서로 다른 실행 순서를 만드는 예시</desc>
  <defs>
    <style>
      .title{font:700 25px sans-serif;fill:#0f172a}.label{font:700 17px sans-serif;fill:#111827}.small{font:14px sans-serif;fill:#334155}.tiny{font:12px sans-serif;fill:#475569}.axis{stroke:#334155;stroke-width:2}.tick{stroke:#64748b;stroke-width:1}.bar{stroke:#0f172a;stroke-width:1.5;rx:8}.note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:12}.cursor{animation:sweep 7s linear infinite}@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(790px)}}
    </style>
  </defs>
  <rect width="1080" height="620" fill="#fff"/>
  <text x="40" y="45" class="title">동일 입력에서 스케줄링 정책별 실행 순서가 달라지는 이유</text>
  <text x="40" y="75" class="small">예시 입력: P1(도착0, 실행8), P2(도착1, 실행4), P3(도착2, 실행2), P4(도착3, 실행1), RR 시간 할당량 q=2</text>
  <g transform="translate(190,115)">
    <line x1="0" y1="0" x2="800" y2="0" class="axis"/>
    <g class="ticks">
      <line x1="0" y1="-6" x2="0" y2="425" class="tick"/><text x="-5" y="445" class="tiny">0</text>
      <line x1="50" y1="-6" x2="50" y2="425" class="tick"/><text x="45" y="445" class="tiny">1</text>
      <line x1="100" y1="-6" x2="100" y2="425" class="tick"/><text x="95" y="445" class="tiny">2</text>
      <line x1="150" y1="-6" x2="150" y2="425" class="tick"/><text x="145" y="445" class="tiny">3</text>
      <line x1="200" y1="-6" x2="200" y2="425" class="tick"/><text x="195" y="445" class="tiny">4</text>
      <line x1="300" y1="-6" x2="300" y2="425" class="tick"/><text x="295" y="445" class="tiny">6</text>
      <line x1="400" y1="-6" x2="400" y2="425" class="tick"/><text x="395" y="445" class="tiny">8</text>
      <line x1="500" y1="-6" x2="500" y2="425" class="tick"/><text x="492" y="445" class="tiny">10</text>
      <line x1="600" y1="-6" x2="600" y2="425" class="tick"/><text x="592" y="445" class="tiny">12</text>
      <line x1="750" y1="-6" x2="750" y2="425" class="tick"/><text x="742" y="445" class="tiny">15</text>
    </g>
    <g class="cursor"><line x1="0" y1="-20" x2="0" y2="420" stroke="#ef4444" stroke-width="3" opacity=".65"/><text x="8" y="-24" class="tiny" fill="#ef4444">시간 흐름</text></g>
    <text x="-150" y="50" class="label">FCFS</text>
    <rect x="0" y="20" width="400" height="48" fill="#bfdbfe" class="bar"/><text x="182" y="50" class="label">P1</text>
    <rect x="400" y="20" width="200" height="48" fill="#bbf7d0" class="bar"/><text x="482" y="50" class="label">P2</text>
    <rect x="600" y="20" width="100" height="48" fill="#fde68a" class="bar"/><text x="637" y="50" class="label">P3</text>
    <rect x="700" y="20" width="50" height="48" fill="#fecaca" class="bar"/><text x="713" y="50" class="label">P4</text>
    <text x="-150" y="145" class="label">SJF</text>
    <rect x="0" y="115" width="400" height="48" fill="#bfdbfe" class="bar"/><text x="182" y="145" class="label">P1</text>
    <rect x="400" y="115" width="50" height="48" fill="#fecaca" class="bar"/><text x="413" y="145" class="label">P4</text>
    <rect x="450" y="115" width="100" height="48" fill="#fde68a" class="bar"/><text x="487" y="145" class="label">P3</text>
    <rect x="550" y="115" width="200" height="48" fill="#bbf7d0" class="bar"/><text x="632" y="145" class="label">P2</text>
    <text x="-150" y="240" class="label">HRN</text>
    <rect x="0" y="210" width="400" height="48" fill="#bfdbfe" class="bar"/><text x="182" y="240" class="label">P1</text>
    <rect x="400" y="210" width="50" height="48" fill="#fecaca" class="bar"/><text x="413" y="240" class="label">P4</text>
    <rect x="450" y="210" width="100" height="48" fill="#fde68a" class="bar"/><text x="487" y="240" class="label">P3</text>
    <rect x="550" y="210" width="200" height="48" fill="#bbf7d0" class="bar"/><text x="632" y="240" class="label">P2</text>
    <text x="-150" y="335" class="label">RR q=2</text>
    <rect x="0" y="305" width="100" height="48" fill="#bfdbfe" class="bar"/><text x="38" y="335" class="label">P1</text>
    <rect x="100" y="305" width="100" height="48" fill="#bbf7d0" class="bar"/><text x="138" y="335" class="label">P2</text>
    <rect x="200" y="305" width="100" height="48" fill="#fde68a" class="bar"/><text x="238" y="335" class="label">P3</text>
    <rect x="300" y="305" width="100" height="48" fill="#bfdbfe" class="bar"/><text x="338" y="335" class="label">P1</text>
    <rect x="400" y="305" width="50" height="48" fill="#fecaca" class="bar"/><text x="413" y="335" class="label">P4</text>
    <rect x="450" y="305" width="100" height="48" fill="#bbf7d0" class="bar"/><text x="488" y="335" class="label">P2</text>
    <rect x="550" y="305" width="200" height="48" fill="#bfdbfe" class="bar"/><text x="632" y="335" class="label">P1</text>
  </g>
  <rect x="45" y="555" width="990" height="45" class="note"/>
  <text x="65" y="583" class="small">풀이 순서: 도착 시각 확인 → Ready Queue 갱신 → 정책 적용 → 간트 차트 작성 → 완료시간으로 반환시간/대기시간 계산</text>
</svg>
