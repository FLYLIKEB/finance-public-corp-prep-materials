<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">CPU 스케줄링 동작 흐름</title>
  <desc id="desc">프로세스가 ready queue에 도착하고, dispatcher가 스케줄링 정책에 따라 CPU에 배정하며, I/O 대기와 종료로 이동하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.title{font:700 24px sans-serif;fill:#0f172a}.label{font:700 17px sans-serif;fill:#0f172a}.small{font:14px sans-serif;fill:#334155}.tiny{font:12px sans-serif;fill:#475569}.p{stroke:#0f172a;stroke-width:1.5;rx:8}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.pulse{animation:pulse 1.6s ease-in-out infinite}.move1{animation:move1 5s linear infinite}.move2{animation:move2 5s linear infinite}.move3{animation:move3 5s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes move1{0%{transform:translate(0,0);opacity:1}22%{transform:translate(220px,0);opacity:1}23%,100%{opacity:0}}@keyframes move2{0%,28%{opacity:0;transform:translate(0,0)}48%{opacity:1;transform:translate(205px,0)}49%,100%{opacity:0}}@keyframes move3{0%,55%{opacity:0;transform:translate(0,0)}76%{opacity:1;transform:translate(-215px,0)}77%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="40" y="48" class="title">CPU 스케줄링: Ready Queue → Dispatcher → CPU → 대기/종료</text>
  <text x="40" y="78" class="small">핵심 질문: 지금 Ready Queue 안에서 누구를 뽑을 것인가? 실행 중인 프로세스를 빼앗을 수 있는가?</text>

  <rect x="45" y="125" width="210" height="210" class="box"/>
  <text x="70" y="158" class="label">Ready Queue</text>
  <text x="70" y="183" class="small">CPU를 기다리는 프로세스</text>
  <rect x="80" y="205" width="140" height="34" fill="#bfdbfe" class="p"/><text x="132" y="228" class="small">P1</text>
  <rect x="80" y="248" width="140" height="34" fill="#bbf7d0" class="p"/><text x="132" y="271" class="small">P2</text>
  <rect x="80" y="291" width="140" height="34" fill="#fde68a" class="p"/><text x="132" y="314" class="small">P3</text>

  <rect x="335" y="155" width="210" height="150" class="box"/>
  <text x="365" y="190" class="label">Scheduler</text>
  <text x="365" y="218" class="small">정책 선택</text>
  <text x="365" y="242" class="tiny">FCFS: 먼저 온 순서</text>
  <text x="365" y="262" class="tiny">SJF: 짧은 실행시간</text>
  <text x="365" y="282" class="tiny">RR: 시간 할당량</text>

  <rect x="625" y="125" width="260" height="210" class="box"/>
  <text x="660" y="158" class="label">CPU</text>
  <text x="660" y="183" class="small">선택된 프로세스 실행</text>
  <rect x="680" y="215" width="150" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="12" class="pulse"/>
  <text x="731" y="252" class="label">RUN</text>

  <path d="M255 230 C290 230 300 230 335 230" class="arrow"/>
  <path d="M545 230 C575 230 590 230 625 230" class="arrow"/>
  <path d="M755 335 C755 405 235 405 170 335" class="arrow dashed"/>
  <text x="390" y="426" class="small">time slice 만료 / 더 높은 우선순위 도착 / I/O 후 재진입</text>

  <rect x="625" y="382" width="110" height="50" fill="#fee2e2" stroke="#991b1b" stroke-width="2" rx="10"/>
  <text x="656" y="412" class="small">I/O Wait</text>
  <path d="M715 335 L690 382" class="arrow"/>

  <rect x="775" y="382" width="110" height="50" fill="#dcfce7" stroke="#166534" stroke-width="2" rx="10"/>
  <text x="808" y="412" class="small">Exit</text>
  <path d="M805 335 L820 382" class="arrow"/>

  <circle cx="80" cy="96" r="8" fill="#2563eb" class="move1"/>
  <circle cx="336" cy="96" r="8" fill="#16a34a" class="move2"/>
  <circle cx="865" cy="96" r="8" fill="#f97316" class="move3"/>
  <path d="M85 96 H885" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="112" class="tiny">도착</text><text x="410" y="112" class="tiny">선택</text><text x="815" y="112" class="tiny">선점/종료</text>
</svg>
