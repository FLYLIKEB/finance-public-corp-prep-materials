<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="1" stop-color="#f4f9fb" />
    </linearGradient>
    <linearGradient id="hostGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e9f3fb" />
      <stop offset="1" stop-color="#dff0fb" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Left: Containers (shared kernel) -->
  <g transform="translate(60,80)">
    <!-- host outer -->
    <rect x="0" y="0" width="320" height="640" rx="18" fill="url(#hostGrad)" stroke="#cfe8fb" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- host kernel layer (shared) -->
    <rect x="28" y="520" width="264" height="70" rx="10" fill="#bfe3f8" stroke="#9fd3ef" stroke-width="1.2"/>
    <!-- small gear icon for kernel (shared) -->
    <g transform="translate(160,555) scale(0.9)" fill="#4fa8d9" opacity="0.95">
      <path d="M0-8 L3-11 L6-9 L9-11 L12-8 L15-8 L14-4 L16-2 L13 0 L14 4 L11 6 L9 4 L6 6 L3 4 L2 0 L-1-2 L1-4 Z" transform="translate(-8,12)"/>
      <circle cx="0" cy="0" r="5" fill="#58b3dd"/>
    </g>

    <!-- three containers stacked, sharing kernel -->
    <g fill="#dff7f0" stroke="#bfeede" stroke-width="1">
      <rect x="40" y="80" width="240" height="110" rx="12"/>
      <rect x="40" y="210" width="240" height="110" rx="12"/>
      <rect x="40" y="340" width="240" height="110" rx="12"/>
    </g>

    <!-- inner app blocks inside containers -->
    <g fill="#8fe0c6">
      <rect x="70" y="110" width="160" height="18" rx="6"/>
      <rect x="70" y="240" width="160" height="18" rx="6"/>
      <rect x="70" y="370" width="160" height="18" rx="6"/>
    </g>

    <!-- container isolation outlines (dashed subtle) -->
    <g stroke="#9fd3ef" stroke-width="1.2" stroke-dasharray="6 6" fill="none">
      <rect x="36" y="76" width="248" height="118" rx="14"/>
      <rect x="36" y="206" width="248" height="118" rx="14"/>
      <rect x="36" y="336" width="248" height="118" rx="14"/>
    </g>

    <!-- slender connecting lines from containers down to shared kernel -->
    <g stroke="#7cbadf" stroke-width="2" stroke-linecap="round">
      <path d="M120 190 L120 520" stroke-dasharray="4 6"/>
      <path d="M200 320 L200 520" stroke-dasharray="4 6"/>
      <path d="M160 440 L160 520" stroke-dasharray="4 6"/>
    </g>

    <!-- subtle label area (no text) - thin bar to suggest area title -->
    <rect x="26" y="26" width="268" height="10" rx="6" fill="#e3f2fb"/>
  </g>

  <!-- Right: VMs (each with its own guest kernel) -->
  <g transform="translate(420,80)">
    <!-- host outer -->
    <rect x="0" y="0" width="320" height="640" rx="18" fill="url(#hostGrad)" stroke="#cfe8fb" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- hypervisor strip above host kernel -->
    <rect x="28" y="520" width="264" height="36" rx="8" fill="#fbe7e6" stroke="#f4c9c8" stroke-width="1.2"/>

    <!-- three VMs stacked; each VM contains its own guest kernel and app -->
    <g>
      <!-- VM 1 -->
      <rect x="40" y="80" width="240" height="160" rx="12" fill="#fff3f3" stroke="#f6d7d7" stroke-width="1.2"/>
      <!-- guest kernel in VM 1 -->
      <rect x="72" y="200" width="156" height="28" rx="8" fill="#ffd6cf" stroke="#f8bfb7" stroke-width="1"/>
      <!-- guest kernel gear -->
      <g transform="translate(200,214) scale(0.6)" fill="#ff8f80" opacity="0.95">
        <path d="M0-8 L3-11 L6-9 L9-11 L12-8 L15-8 L14-4 L16-2 L13 0 L14 4 L11 6 L9 4 L6 6 L3 4 L2 0 L-1-2 L1-4 Z" transform="translate(-8,12)"/>
        <circle cx="0" cy="0" r="5" fill="#ff9b88"/>
      </g>
      <!-- app block inside VM 1 -->
      <rect x="86" y="116" width="128" height="20" rx="6" fill="#ffcfc6"/>

      <!-- VM 2 -->
      <rect x="40" y="270" width="240" height="160" rx="12" fill="#fff3f3" stroke="#f6d7d7" stroke-width="1.2"/>
      <rect x="72" y="390" width="156" height="28" rx="8" fill="#ffd6cf" stroke="#f8bfb7" stroke-width="1"/>
      <g transform="translate(200,404) scale(0.6)" fill="#ff8f80" opacity="0.95">
        <path d="M0-8 L3-11 L6-9 L9-11 L12-8 L15-8 L14-4 L16-2 L13 0 L14 4 L11 6 L9 4 L6 6 L3 4 L2 0 L-1-2 L1-4 Z" transform="translate(-8,12)"/>
        <circle cx="0" cy="0" r="5" fill="#ff9b88"/>
      </g>
      <rect x="86" y="306" width="128" height="20" rx="6" fill="#ffcfc6"/>

      <!-- VM 3 -->
      <rect x="40" y="460" width="240" height="160" rx="12" fill="#fff3f3" stroke="#f6d7d7" stroke-width="1.2"/>
      <rect x="72" y="580" width="156" height="28" rx="8" fill="#ffd6cf" stroke="#f8bfb7" stroke-width="1"/>
      <g transform="translate(200,594) scale(0.6)" fill="#ff8f80" opacity="0.95">
        <path d="M0-8 L3-11 L6-9 L9-11 L12-8 L15-8 L14-4 L16-2 L13 0 L14 4 L11 6 L9 4 L6 6 L3 4 L2 0 L-1-2 L1-4 Z" transform="translate(-8,12)"/>
        <circle cx="0" cy="0" r="5" fill="#ff9b88"/>
      </g>
      <rect x="86" y="506" width="128" height="20" rx="6" fill="#ffcfc6"/>
    </g>

    <!-- subtle separation lines showing VMs have their own kernels (no shared connectors) -->
    <g stroke="#f3bfb9" stroke-width="1.4" stroke-linecap="round">
      <path d="M40 240 L280 240" stroke-dasharray="2 6"/>
      <path d="M40 420 L280 420" stroke-dasharray="2 6"/>
    </g>

    <!-- subtle label area (no text) - thin bar to suggest area title -->
    <rect x="26" y="26" width="268" height="10" rx="6" fill="#fff5f4"/>
  </g>

  <!-- connectors and explanatory graphic hints (no text) -->
  <g opacity="0.9">
    <!-- curved arrow-like paths (no arrowheads) to suggest difference: left sharing downward, right encapsulated -->
    <path d="M280 420 C340 420 380 500 420 500" fill="none" stroke="#bfe3f8" stroke-width="2.2" stroke-dasharray="6 5" opacity="0.6"/>
    <path d="M520 360 C580 360 620 280 680 280" fill="none" stroke="#ffcec7" stroke-width="2.2" stroke-dasharray="6 5" opacity="0.6"/>
  </g>

  <!-- small security icons (padlocks) to hint concerns like secrets and RBAC; no text -->
  <g transform="translate(330,40)" opacity="0.9">
    <!-- padlock left (container side) -->
    <g transform="translate(-40,0) scale(0.9)">
      <rect x="8" y="6" width="20" height="18" rx="3" fill="#e6fbf4" stroke="#bfeede" stroke-width="1.2"/>
      <path d="M18 6 V2 A6 6 0 0 1 30 2 V6" fill="none" stroke="#9fd3ef" stroke-width="2" stroke-linecap="round"/>
      <circle cx="18" cy="15" r="2" fill="#7ccfb8"/>
    </g>
    <!-- padlock right (vm side) -->
    <g transform="translate(140,0) scale(0.9)">
      <rect x="8" y="6" width="20" height="18" rx="3" fill="#fff6f6" stroke="#f6d7d7" stroke-width="1.2"/>
      <path d="M18 6 V2 A6 6 0 0 1 30 2 V6" fill="none" stroke="#f8bfb7" stroke-width="2" stroke-linecap="round"/>
      <circle cx="18" cy="15" r="2" fill="#ffb4a8"/>
    </g>
  </g>

  <!-- framing subtle border -->
  <rect x="6" y="6" width="788" height="788" rx="16" fill="none" stroke="#e6eef3" stroke-width="2"/>
</svg>